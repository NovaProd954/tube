name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run sync
      - run: chmod +x android/gradlew
      - name: Build debug APK
        shell: bash
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
        working-directory: android
      - name: Save build log to ci-log branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/lg && (cp build.log /tmp/lg/build.log 2>/dev/null || echo "no build log" > /tmp/lg/build.log)
          cd /tmp/lg && git init -q -b ci-log && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "build log ${GITHUB_SHA::7}" && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-log
      - uses: actions/upload-artifact@v4
        with:
          name: tube-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Tube.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Tube.apk --title "Tube APK (latest)" --notes "Debug build of commit ${GITHUB_SHA::7}. Install it on Android and open Tube: the on-device engine starts automatically."
